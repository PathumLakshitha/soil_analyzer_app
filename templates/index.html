<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tea Soil Analyzer</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles.css') }}"
    />
  </head>
  <body>
    <div class="main-container">
      <h1 class="main-heading">Tea Soil Analyzer</h1>
      <div class="container">
        <!-- Left Panel: Input Form -->
        <div class="left-panel">
          <form
            id="uploadForm"
            method="POST"
            enctype="multipart/form-data"
            action="/predict"
          >
            <label for="file">Upload Soil Image:</label>
            <input type="file" name="file" id="file" required />

            <label for="pH_value">Enter pH Value:</label>
            <input
              type="number"
              name="pH_value"
              id="pH_value"
              step="0.1"
              min="0"
              max="14"
            />

            <div id="ph-error" class="ph-error"></div>

            <button type="submit">Predict Soil Type</button>
            <button type="button" id="resetButton" class="reset-button">
              Reset
            </button>
          </form>
        </div>
        <!-- Right Panel: Output -->
        <div class="right-panel">
          <div id="result">
            <div class="result-container">
              <!-- Placeholder or Uploaded Image -->
              <img id="result-image" src="" alt="Uploaded Soil Image" />

              <!-- Prediction Details -->

              <div class="result-details">
                <div class="result-header">
                  <span class="result-label">PREDICTION RESULT</span>
                </div>

                <div class="soil-type-card">
                  <span class="detail-label">SOIL TYPE</span>
                  <div class="soil-type-value">
                    <span class="soil-icon" id="soil-icon"></span>
                    <span id="soil-type">N/A</span>
                  </div>
                </div>

                <div class="confidence-section">
                  <div class="confidence-header">
                    <span class="detail-label">CONFIDENCE LEVEL</span>
                    <span id="confidence">N/A</span
                    ><span id="confidence-symbol">%</span>
                  </div>

                  <div class="confidence-bar">
                    <div id="confidence-fill" class="confidence-fill"></div>
                  </div>

                  <p id="confidence-description">Waiting for prediction...</p>
                </div>
              </div>
            </div>
          </div>
        </div>
        <!-- Additional Recommendations -->
        <!-- Additional Recommendations -->
        <div class="recommendations">
          <div class="mix-ratio">
            <p>
              <span class="mix-bullet">•</span>
              <b>Rice Hull Mix Percentage:</b>
              <span id="rice-hull-percentage">N/A</span>%
            </p>

            <p>
              <span class="mix-bullet">•</span>
              <b>Rice Hull–Soil Mix Ratio:</b>
              <span id="simplified-rice-hull-ratio">N/A</span>
              :
              <span id="simplified-soil-ratio">N/A</span>
            </p>
          </div>

          <span class="result-label">PH ADJUSTMENT RECOMMENDATIONS</span>

          <table class="ph-table" id="ph-recommendation-table">
            <tbody>
              <tr id="option-sulfur">
                <td class="option-name">&nbsp;</td>
                <td class="option-description">&nbsp;</td>
              </tr>

              <tr id="option-aluminum">
                <td class="option-name">&nbsp;</td>
                <td class="option-description">&nbsp;</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      const form = document.getElementById("uploadForm");

      form.onsubmit = async (e) => {
        e.preventDefault();

        const formData = new FormData(form);

        const response = await fetch("/predict", {
          method: "POST",
          body: formData,
        });

        const result = await response.json();

        if (result.error) {
          document.getElementById("ph-error").textContent = result.error;
          return;
        }

        document.getElementById("ph-error").textContent = "";

        // ==============================
        // SOIL TYPE
        // ==============================

        const soilType = result.soil_type;

        document.getElementById("soil-type").textContent = soilType;

        // Set soil type bullet color
        const soilIcon = document.getElementById("soil-icon");

        if (soilType === "Reddish_brown_latasol_soil") {
          soilIcon.style.backgroundColor = "#cc0000";
        } else if (soilType === "Red_yellow_podzolic_soil") {
          soilIcon.style.backgroundColor = "#d9a72e";
        } else if (soilType === "Immature_brown_loamy_soil") {
          soilIcon.style.backgroundColor = "#652A0E";
        } else {
          soilIcon.style.backgroundColor = "#ccc";
        }

        // ==============================
        // CONFIDENCE
        // ==============================

        const confidencePercentage = result.confidence_score * 100;

        document.getElementById("confidence").textContent =
          confidencePercentage.toFixed(2);

        document.getElementById("confidence-fill").style.width =
          confidencePercentage.toFixed(2) + "%";

        const confidenceDescription = document.getElementById(
          "confidence-description",
        );

        if (confidencePercentage >= 80) {
          confidenceDescription.textContent = "High confidence prediction";
        } else if (confidencePercentage >= 60) {
          confidenceDescription.textContent = "Moderate confidence prediction";
        } else {
          confidenceDescription.textContent = "Low confidence prediction";
        }

        // ==============================
        // IMAGE
        // ==============================

        document.getElementById("result-image").src = result.file_path;

        // ==============================
        // RICE HULL MIX
        // ==============================

        const riceHullPercentage = parseFloat(result.bramble_mix_ratio);

        document.getElementById("rice-hull-percentage").textContent =
          riceHullPercentage;

        // Ignore decimal part for ratio calculation
        const riceHullRatio = Math.floor(riceHullPercentage);
        const soilRatio = 100 - riceHullRatio;

        // Find GCD
        function gcd(a, b) {
          while (b !== 0) {
            const temp = b;
            b = a % b;
            a = temp;
          }

          return a;
        }

        const divisor = gcd(riceHullRatio, soilRatio);

        const simpleRiceHullRatio = riceHullRatio / divisor;

        const simpleSoilRatio = soilRatio / divisor;

        document.getElementById("simplified-rice-hull-ratio").textContent =
          simpleRiceHullRatio;

        document.getElementById("simplified-soil-ratio").textContent =
          simpleSoilRatio;

        // ==============================
        // PH ADJUSTMENT RECOMMENDATIONS
        // ==============================

        const phTable = document.getElementById("ph-recommendation-table");
        const sulfurRow = document.getElementById("option-sulfur");
        const aluminumRow = document.getElementById("option-aluminum");

        // Always show PH table
        phTable.style.display = "table";

        const phValue = document.getElementById("pH_value").value;

        if (!phValue) {
          // No pH entered
          sulfurRow.innerHTML = `
    <td class="option-name">INFO</td>
    <td class="option-description">
      Enter the pH value of the soil sample for more accurate pH adjustment recommendations.
    </td>
  `;

          aluminumRow.innerHTML = `
    <td class="option-name">&nbsp;</td>
    <td class="option-description">&nbsp;</td>
  `;
        } else {
          if (result.pH_adjustment_sulfur) {
            const isStatus =
              result.pH_adjustment_sulfur ===
              "The soil pH is already suitable for tea nurseries.";

            sulfurRow.innerHTML = `
      <td class="option-name">
        ${isStatus ? "STATUS" : "OPTION 1 (Sulfur)"}
      </td>
      <td class="option-description">
        ${result.pH_adjustment_sulfur}
      </td>
    `;
          } else {
            sulfurRow.innerHTML = `
      <td class="option-name">&nbsp;</td>
      <td class="option-description">&nbsp;</td>
    `;
          }

          if (result.pH_adjustment_aluminum) {
            aluminumRow.innerHTML = `
      <td class="option-name">
        OPTION 2 (Aluminum Sulfate)
      </td>
      <td class="option-description">
        ${result.pH_adjustment_aluminum}
      </td>
    `;
          } else {
            aluminumRow.innerHTML = `
      <td class="option-name">&nbsp;</td>
      <td class="option-description">&nbsp;</td>
    `;
          }
        }
      };

      // ==============================
      // RESET BUTTON
      // ==============================

      const resetButton = document.getElementById("resetButton");

      resetButton.addEventListener("click", () => {
        // Reset form
        form.reset();

        // Clear PH error
        document.getElementById("ph-error").textContent = "";

        // Reset prediction
        document.getElementById("soil-type").textContent = "N/A";

        document.getElementById("soil-icon").style.backgroundColor = "#ccc";

        document.getElementById("confidence").textContent = "N/A";

        document.getElementById("confidence-fill").style.width = "0%";

        document.getElementById("confidence-description").textContent =
          "Waiting for prediction...";

        // Reset rice hull
        document.getElementById("rice-hull-percentage").textContent = "N/A";

        document.getElementById("simplified-rice-hull-ratio").textContent =
          "N/A";

        document.getElementById("simplified-soil-ratio").textContent = "N/A";

        // Clear image
        document.getElementById("result-image").src = "";

        // Clear PH recommendations
        document.getElementById("ph-recommendation-table").style.display =
          "table";

        document.getElementById("option-sulfur").innerHTML = `
  <td class="option-name">&nbsp;</td>
  <td class="option-description">&nbsp;</td>
`;

        document.getElementById("option-aluminum").innerHTML = `
  <td class="option-name">&nbsp;</td>
  <td class="option-description">&nbsp;</td>
`;
      });
    </script>
  </body>
</html>
